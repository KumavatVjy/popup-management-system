    PopupPositionEnum:
      type: string
      description: Supported popup screen placement
      enum:
        - center
        - top-banner
        - bottom-left
        - bottom-right
      example: "center"

    CreatePopupRequest:
      type: object
      required:
        - website_id
        - title
        - content
        - position
      properties:
        website_id:
          type: integer
          format: int64
          description: ID of an existing website
          example: 1
        title:
          type: string
          minLength: 2
          maxLength: 255
          example: "Spring Promotion"
        content:
          type: string
          description: HTML or text content of the popup
          example: "<p>Get 20% off with promo code SPRING20</p>"
        position:
          $ref: '#/components/schemas/PopupPositionEnum'
        status:
          type: boolean
          default: true
          example: true
        start_time:
          type: string
          format: date-time
          nullable: true
          description: Scheduled start time (ISO 8601 / RFC 3339)
          example: "2026-04-01T00:00:00Z"
        end_time:
          type: string
          format: date-time
          nullable: true
          description: Scheduled end time (ISO 8601 / RFC 3339)
          example: "2026-04-30T23:59:59Z"

    UpdatePopupRequest:
      type: object
      required:
        - title
        - content
        - position
      description: Popup update payload. Note that website_id is immutable and cannot be modified.
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 255
          example: "Summer Promotion"
        content:
          type: string
          description: Updated HTML or text content
          example: "<p>Summer discounts available now!</p>"
        position:
          $ref: '#/components/schemas/PopupPositionEnum'
        status:
          type: boolean
          example: true
        start_time:
          type: string
          format: date-time
          nullable: true
          example: "2026-06-01T00:00:00Z"
        end_time:
          type: string
          format: date-time
          nullable: true
          example: "2026-06-30T23:59:59Z"

    PopupResponse:
      type: object
      required:
        - id
        - website_id
        - title
        - content
        - position
        - status
      properties:
        id:
          type: integer
          format: int64
          example: 1
        website_id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: "Spring Promotion"
        content:
          type: string
          example: "<p>Get 20% off with promo code SPRING20</p>"
        position:
          type: string
          example: "center"
        status:
          type: boolean
          example: true
        start_time:
          type: string
          format: date-time
          nullable: true
          example: "2026-04-01T00:00:00Z"
        end_time:
          type: string
          format: date-time
          nullable: true
          example: "2026-04-30T23:59:59Z"

    SinglePopupResponse:
      type: object
      required:
